<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Container query cards</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="layout">
      <section class="card-host">
        <article class="card">
          <div class="card-media" aria-hidden="true"></div>
          <div>
            <h2>Main column card</h2>
            <p>This card has plenty of room, so it uses a side-by-side layout.</p>
          </div>
        </article>
      </section>
      <aside class="card-host">
        <article class="card">
          <div class="card-media" aria-hidden="true"></div>
          <div>
            <h2>Sidebar card</h2>
            <p>The same component stacks itself in a narrow container.</p>
          </div>
        </article>
      </aside>
    </main>
  </body>
</html>
