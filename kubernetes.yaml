apiVersion: v1
kind: ConfigMap
metadata:
  name: stacked-config
data:
  SITE_URL: ""
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stacked-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stacked
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: stacked
  template:
    metadata:
      labels:
        app: stacked
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: blog
          image: ped-tech-blog:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: DATA_DIR
              value: /app/data
            - name: SITE_URL
              valueFrom:
                configMapKeyRef:
                  name: stacked-config
                  key: SITE_URL
            - name: PUBLISH_KEY
              valueFrom:
                secretKeyRef:
                  name: stacked-publishing
                  key: publish-key
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: stacked-data
---
apiVersion: v1
kind: Service
metadata:
  name: stacked
spec:
  selector:
    app: stacked
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
